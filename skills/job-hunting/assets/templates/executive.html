<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} — Resume</title>
<style>
/* Executive — single column with generous margins, a large serif name
   (~1.85x the heading), hairline rules, near-monochrome. Whitespace does
   the talking. */
@page { size: A4; margin: 14mm; }
:root {
  --accent: #3b3b3b;
  --ink: #1b1b1b;
  --muted: #595959;
  --body: 10pt;
  --small: 9pt;
  --h2: 12.5pt;
  --name: 23pt;   /* ~1.85x the heading */
  --gap: 7pt;     /* item gap; sections take 2x */
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #fff; }
body {
  font-family: "Helvetica Neue", "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: var(--body);
  line-height: 1.45;
  color: var(--ink);
  padding: 5mm 9mm 0;   /* on top of the page margin: ~23 mm a side */
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
h1, h2, h3, p, ul { margin: 0; }
a { color: inherit; text-decoration: none; }

header {
  display: flex;
  align-items: flex-end;
  gap: 14pt;
  padding-bottom: 10pt;
  border-bottom: 0.5pt solid var(--accent);
}
header .id { flex: 1; }
h1 {
  font-family: Baskerville, "Baskerville Old Face", "Libre Baskerville", Garamond, Georgia, serif;
  font-size: var(--name);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: 0.01em;
}
.headline { margin-top: 5pt; font-size: var(--small); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.headline:empty { display: none; }
.contact { list-style: none; padding: 0; text-align: right; font-size: var(--small); color: var(--muted); line-height: 1.5; }
.photo { width: 20mm; height: 25mm; object-fit: cover; }

.section { margin-top: calc(var(--gap) * 2); }
.section-title {
  display: flex;
  align-items: center;
  gap: 10pt;
  font-size: var(--h2);
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: var(--gap);
  break-after: avoid;
}
.section-title::after { content: ""; flex: 1; border-top: 0.5pt solid var(--accent); }
.entry + .entry { margin-top: calc(var(--gap) * 1.3); }
.entry-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12pt; break-inside: avoid; break-after: avoid; }
.entry-title { font-size: 10.5pt; font-weight: 600; }
.org-sep { display: none; }
.org { display: block; font-weight: 400; font-style: italic; color: var(--muted); }
.dates { flex: none; font-size: var(--small); color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; }
.dated { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; }
.line + .line { margin-top: 2pt; }
.bullets { list-style: "\2013\00A0\00A0"; padding-left: 11pt; margin-top: 4pt; }
.bullets li { margin-bottom: 2.5pt; break-inside: avoid; }
.skill-group { display: grid; grid-template-columns: 34mm 1fr; column-gap: 8pt; }
.skill-group + .skill-group { margin-top: 3pt; }
.skill-label { color: var(--muted); }
.skill-colon { display: none; }
.tags, .tags li { display: inline; padding: 0; list-style: none; }
</style>
</head>
<body>
<header>
<div class="id">
<h1>{{name}}</h1>
<p class="headline">{{headline}}</p>
</div>
{{contact_html}}
{{photo_html}}
</header>
<main>
{{sections_html}}
</main>
</body>
</html>
