<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-hunter — how it works, head to toe</title>
<style>
  :root {
    --bg: #070b16; --panel: rgba(10, 16, 32, 0.86); --line: rgba(148, 163, 184, 0.18);
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --panel-w: 400px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }

  #panel { position: fixed; top: 16px; left: 16px; bottom: 88px; width: var(--panel-w);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 22px; overflow-y: auto; backdrop-filter: blur(8px); }
  #panel .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #panel .kicker b { color: var(--role, var(--accent)); font-weight: 600; }
  #panel h1 { margin: 6px 0 10px; font-size: 22px; line-height: 1.25; font-weight: 650; }
  #panel .cmd { display: inline-block; font: 13px/1.4 Consolas, "Cascadia Mono", monospace;
    background: rgba(56, 189, 248, .1); border: 1px solid rgba(56, 189, 248, .3); color: #bae6fd;
    padding: 4px 9px; border-radius: 7px; margin-bottom: 12px; }
  #panel p { margin: 0 0 12px; color: #cbd5e1; }
  #panel ol { margin: 0 0 14px; padding: 0; list-style: none; counter-reset: s; }
  #panel ol li { counter-increment: s; position: relative; padding: 5px 0 5px 30px; color: #cbd5e1;
    border-left: 1px dashed var(--line); margin-left: 10px; }
  #panel ol li::before { content: counter(s); position: absolute; left: -11px; top: 5px; width: 20px; height: 20px;
    border-radius: 50%; background: #0f172a; border: 1px solid var(--role, var(--accent)); color: var(--role, var(--accent));
    font-size: 11px; display: grid; place-items: center; }
  #panel ol li.on { color: #fff; }
  #panel ol li.on::before { background: var(--role, var(--accent)); color: #0b1020; }
  #panel h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 12px Consolas, "Cascadia Mono", monospace; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: #cbd5e1; background: rgba(15, 23, 42, .7); }
  .chip.file { border-color: rgba(250, 204, 21, .35); color: #fde68a; }
  .chip.script { border-color: rgba(167, 139, 250, .4); color: #ddd6fe; }
  #panel .note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 14px; }

  #controls { position: fixed; left: 16px; right: 16px; bottom: 16px; height: 56px; display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; backdrop-filter: blur(8px); }
  #controls button { background: #0f172a; color: var(--text); border: 1px solid var(--line); border-radius: 9px;
    height: 36px; min-width: 40px; padding: 0 12px; cursor: pointer; font: inherit; }
  #controls button:hover { border-color: var(--accent); }
  #controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #dots { flex: 1; display: flex; gap: 4px; align-items: center; overflow-x: auto; }
  #dots button { flex: 1; min-width: 26px; height: 30px; padding: 0 6px; font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
  #dots button.on { color: #0b1020; background: var(--role, var(--accent)); border-color: transparent; font-weight: 600; }
  #dots button .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; }
  #hint { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .lbl { font: 12px/1.3 "Segoe UI", system-ui, sans-serif; color: #e2e8f0; padding: 3px 8px; border-radius: 7px;
    background: rgba(7, 11, 22, .78); border: 1px solid var(--line); white-space: nowrap; transition: opacity .35s;
    text-align: center; }
  .lbl.station { font-size: 13px; font-weight: 600; border-color: var(--c, var(--line)); }
  .lbl.station small { display: block; font: 11px Consolas, monospace; color: var(--muted); font-weight: 400; }
  .lbl.station.dim { opacity: .22; }
  .lbl.detail { font-size: 11px; color: #cbd5e1; opacity: 0; }
  .lbl.detail.show { opacity: 1; }
  .lbl.detail.ok { border-color: rgba(34, 197, 94, .7); color: #bbf7d0; }
  .lbl.detail.bad { border-color: rgba(239, 68, 68, .7); color: #fecaca; }
  .lbl.tile { font: 11px Consolas, monospace; padding: 1px 6px; opacity: .55; }
  .lbl.tile.hot { opacity: 1; border-color: #facc15; color: #fde68a; }
  .lbl.pill { font-size: 11px; padding: 1px 7px; opacity: .6; }
  .lbl.pill.hot { opacity: 1; border-color: #22c55e; color: #bbf7d0; }
  .lbl.readout { font: 12px Consolas, monospace; border-color: rgba(56, 189, 248, .5); color: #bae6fd; }

  @media (max-width: 820px) {
    :root { --panel-w: auto; }
    #panel { top: auto; right: 16px; bottom: 84px; max-height: 42vh; width: auto; }
    #hint { display: none; }
    #dots button { font-size: 0; min-width: 14px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<aside id="panel" aria-live="polite"></aside>
<nav id="controls" aria-label="Walkthrough controls">
  <button id="prev" title="Previous step (←)">◀</button>
  <button id="play" title="Play / pause (space)">❚❚</button>
  <button id="next" title="Next step (→)">▶</button>
  <div id="dots"></div>
  <span id="hint">drag to orbit · scroll to zoom</span>
</nav>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const C = {
  ring: 0x38bdf8, strategist: 0xa78bfa, scout: 0x38bdf8, qualifier: 0xfacc15, networker: 0x34d399,
  writer: 0xf472b6, coach: 0xfb923c, ops: 0x60a5fa, negotiator: 0xe879f9, onboarder: 0x4ade80,
  hub: 0xfacc15, ok: 0x22c55e, bad: 0xef4444, base: 0x111a2e, steel: 0x334155, paper: 0xf1f5f9,
};
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const seg = (t, a, b) => clamp01((t - a) / (b - a));

// ---------- renderer, scene, camera ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b16);
scene.fog = new THREE.Fog(0x070b16, 38, 80);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(7, 27, 33);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 4; controls.maxDistance = 60;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.45, 0.8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.HemisphereLight(0x9fb8ff, 0x0a0f1e, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(8, 16, 10);
scene.add(key);
const rim = new THREE.DirectionalLight(0x38bdf8, 0.6);
rim.position.set(-12, 6, -14);
scene.add(rim);

// ---------- helpers ----------
function mat(color, glow = 0, extra = {}) {
  return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: glow, roughness: .55, metalness: .15, ...extra });
}
function mesh(geo, material, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, material); m.position.set(x, y, z); if (parent) parent.add(m); return m;
}
function label(html, cls, parent, x = 0, y = 0, z = 0, color) {
  const el = document.createElement('div');
  el.className = 'lbl ' + (cls || '');
  el.innerHTML = html;
  if (color !== undefined) el.style.setProperty('--c', hex(color));
  const o = new CSS2DObject(el); o.position.set(x, y, z); parent.add(o);
  return el;
}
function rod(a, b, radius, material, parent) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, d.length(), 8), material);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
  parent.add(m); return m;
}
function pedestal(group, color, r = 2.1) {
  mesh(new THREE.CylinderGeometry(r, r + .15, .28, 48), mat(C.base), 0, .14, 0, group);
  const edge = mesh(new THREE.TorusGeometry(r + .02, .035, 8, 96), mat(color, 1.4), 0, .29, 0, group);
  edge.rotation.x = Math.PI / 2;
  return edge;
}
const cardGeo = new THREE.BoxGeometry(.34, .22, .025);

// ---------- ground ----------
const ground = mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: 0x0a1122, roughness: 1 }), 0, 0, 0, scene);
ground.rotation.x = -Math.PI / 2;
const grid = new THREE.PolarGridHelper(30, 24, 12, 96, 0x1e2a44, 0x141d33);
grid.position.y = .01; scene.add(grid);

// ---------- the loop ring ----------
const R = 9;
const ANG = { scout: 120, qualifier: 180, networker: 240, writer: 300, coach: 360, ops: 420 }; // degrees, travel order
const ringPos = (deg, y = 0) => new THREE.Vector3(R * Math.cos(deg * Math.PI / 180), y, R * Math.sin(deg * Math.PI / 180));

const ringBase = mesh(new THREE.TorusGeometry(R, .07, 8, 256), mat(C.ring, .25), 0, .05, 0, scene);
ringBase.rotation.x = Math.PI / 2;
class Arc extends THREE.Curve {
  constructor(r, startDeg) { super(); this.r = r; this.s = startDeg * Math.PI / 180; }
  getPoint(t, target = new THREE.Vector3()) { const a = this.s + t * Math.PI * 2; return target.set(this.r * Math.cos(a), .07, this.r * Math.sin(a)); }
}
const TUBE_SEG = 256, TUBE_RAD = 8;
const progressTube = mesh(new THREE.TubeGeometry(new Arc(R, ANG.scout), TUBE_SEG, .13, TUBE_RAD, false), mat(C.ring, 2.2), 0, 0, 0, scene);
let ringProgress = 0, ringProgressTarget = 0;
function setRingDraw(f) { progressTube.geometry.setDrawRange(0, Math.floor(clamp01(f) * TUBE_SEG) * TUBE_RAD * 6); }
setRingDraw(0);
// direction chevrons on the ring
const chevGeo = new THREE.ConeGeometry(.16, .4, 3);
for (let i = 0; i < 24; i++) {
  const a = i / 24 * Math.PI * 2;
  const m = mesh(chevGeo, mat(C.ring, .6), R * Math.cos(a), .12, R * Math.sin(a), scene);
  m.rotation.z = -Math.PI / 2;                       // point along local +x
  m.rotation.y = -(a + Math.PI / 2);                 // then along the tangent (increasing angle)
}

// ---------- stations ----------
const stations = {};
function station(keyName, pos, color, title, cmd, faceFront = false) {
  const g = new THREE.Group(); g.position.copy(pos);
  g.rotation.y = faceFront ? 0 : Math.atan2(pos.x, pos.z);   // local +z faces outward (spur: faces the viewer)
  scene.add(g);
  const edge = pedestal(g, color);
  const lbl = label(`${title}<small>${cmd}</small>`, 'station dim', g, 0, 4.3, 0, color);
  const s = { key: keyName, group: g, color, edge, lbl, details: [], keep: [], faceFront, update: () => {} };
  stations[keyName] = s; return s;
}
function keep(s, html, x, y, z) { const el = label(html, 'detail', s.group, x, y, z); s.keep.push(el); return el; }
function detail(s, html, x, y, z, cls = '') { const el = label(html, 'detail ' + cls, s.group, x, y, z); s.details.push(el); return el; }
const L = (s, x, y, z) => s.group.localToWorld(new THREE.Vector3(x, y, z));

// --- hub: the workspace folder ---
const hub = new THREE.Group(); scene.add(hub);
mesh(new THREE.CylinderGeometry(3.3, 3.5, .35, 64), mat(C.base), 0, .17, 0, hub);
const hubEdge = mesh(new THREE.TorusGeometry(3.32, .04, 8, 128), mat(C.hub, 1.2), 0, .36, 0, hub); hubEdge.rotation.x = Math.PI / 2;
const hubLbl = label('Workspace  ~/job-hunt<small>your files — the only memory</small>', 'station dim', hub, 0, 3.1, 0, C.hub);
const TILES = ['profile.md', 'pipeline.md', 'contacts.md', 'answers.md', 'seen-jobs.json',
  'postings/', 'resumes/', 'letters/', 'dossiers/', 'interviews/', 'reviews/'];
const tiles = {};
TILES.forEach((name, i) => {
  const a = Math.PI / 2 + i / TILES.length * Math.PI * 2;
  const folder = name.endsWith('/');
  const g = new THREE.Group(); g.position.set(2.35 * Math.cos(a), .36, 2.35 * Math.sin(a));
  g.rotation.y = Math.atan2(g.position.x, g.position.z); hub.add(g);
  const m = mat(folder ? 0xd9a441 : C.paper, .05);
  const body = mesh(folder ? new THREE.BoxGeometry(.7, .5, .5) : new THREE.BoxGeometry(.55, .75, .05), m, 0, folder ? .25 : .38, 0, g);
  if (folder) mesh(new THREE.BoxGeometry(.3, .08, .5), m, -.18, .54, 0, g);
  else for (let k = 0; k < 4; k++) mesh(new THREE.BoxGeometry(.36, .025, .01), mat(0x94a3b8), 0, .58 - k * .1, .03, g);
  const el = label(name, 'tile', g, 0, 1.05, 0);
  tiles[name] = { g, m, el, heat: 0 };
});
// the jh launcher in the middle of the hub
const jh = new THREE.Group(); hub.add(jh);
mesh(new THREE.CylinderGeometry(.55, .6, 1.1, 6), mat(0x1e293b), 0, .9, 0, jh);
const jhCore = mesh(new THREE.CylinderGeometry(.3, .3, 1.16, 6), mat(C.strategist, 1.2), 0, .9, 0, jh);
const jhLbl = label('jh launcher', 'tile', jh, 0, 1.85, 0);
const PROBES = ['python3', 'python', 'py -3', 'uv run'];
const probes = PROBES.map((p, i) => {
  const a = Math.PI / 2 - (i - 1.5) * .55;
  const m = mat(C.steel, .2);
  const o = mesh(new THREE.BoxGeometry(.32, .16, .08), m, 1.05 * Math.cos(a), 1.5, 1.05 * Math.sin(a) + 0.0, jh);
  o.lookAt(0, 1.5, 0);
  const el = label(p, 'detail', o, 0, .28, 0);
  return { m, el };
});

// --- pipeline stage ladder (pipeline.md), floating above the hub ---
const STAGES = ['saved', 'applied', 'screen', 'interview', 'final', 'offer', 'accepted'];
const ladder = new THREE.Group(); ladder.position.set(0, 11.5, -2); ladder.scale.setScalar(1.35); scene.add(ladder);
const pills = STAGES.map((s, i) => {
  const m = mat(C.steel, .1);
  const o = mesh(new THREE.BoxGeometry(.95, .3, .12), m, -3.3 + i * 1.1, 0, 0, ladder);
  if (i) mesh(new THREE.BoxGeometry(.15, .04, .04), mat(C.steel), -3.85 + i * 1.1, 0, 0, ladder);
  const el = label(s, 'pill', o, 0, .38, 0);
  return { m, el };
});
label('pipeline.md stages', 'tile', ladder, 0, -.55, 0);
let stageLit = 0;

// --- Strategist (spoke from hub to the ring) ---
{
  const s = station('strategist', new THREE.Vector3(5.6 * Math.cos(Math.PI / 2), 0, 5.6 * Math.sin(Math.PI / 2)), C.strategist, '1 · Strategist', 'plain English');
  s.edge.scale.setScalar(.62); s.group.children[0].scale.set(.62, 1, .62);
  s.group.children.find(c => c.isCSS2DObject).position.y = 3.3;
  const rings = [1.0, .68, .36].map((r, i) => {
    const m = mesh(new THREE.TorusGeometry(r, .06, 10, 64), mat(i === 2 ? C.bad : C.strategist, .9), 0, 1.6, -.2, s.group); return m;
  });
  const arrow = new THREE.Group(); s.group.add(arrow);
  rod(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 1.4), .04, mat(0xe2e8f0, .4), arrow);
  const tip = mesh(new THREE.ConeGeometry(.1, .3, 12), mat(0xe2e8f0, .6), 0, 0, -.1, arrow); tip.rotation.x = -Math.PI / 2;
  const d1 = detail(s, 'target roles & titles', -1.6, 2.5, 0);
  const d2 = detail(s, 'market (MY / SG)', 1.6, 2.2, 0);
  const d3 = detail(s, 'salary floor & dealbreakers', 0, .75, 1.2);
  s.update = (t, time) => {
    rings.forEach((r, i) => { r.rotation.y = Math.sin(time * .6 + i) * .25; });
    const a = ease(seg(t, .1, .45));
    arrow.position.set(0, 1.6, THREE.MathUtils.lerp(3.2, -.1, a));
    arrow.visible = t > .05;
    d1.classList.toggle('show', t > .45); d2.classList.toggle('show', t > .55); d3.classList.toggle('show', t > .65);
  };
}

// --- Scout: three boards → filter funnel → shortlist ---
{
  const s = station('scout', ringPos(ANG.scout), C.scout, '2 · Scout', '/job-hunter:search');
  const boards = [['JobStreet MY/SG', 0x7c3aed, -1.35, 2.5], ['MyCareersFuture', 0xef4444, 0, 2.9], ['LinkedIn', 0x0ea5e9, 1.35, 2.5]];
  const towerTops = boards.map(([name, col, x, h]) => {
    mesh(new THREE.BoxGeometry(.5, h, .5), mat(0x1e293b), x, h / 2 + .28, -1.25, s.group);
    mesh(new THREE.BoxGeometry(.56, .14, .56), mat(col, 1.6), x, h + .32, -1.25, s.group);
    s.boardLbls = (s.boardLbls || []).concat(detail(s, name, x, h + .7, -1.25));
    return new THREE.Vector3(x, h + .45, -1.25);
  });
  const funnelPts = [];
  for (let i = 0; i <= 12; i++) { const k = i / 12; funnelPts.push(new THREE.Vector2(THREE.MathUtils.lerp(.22, .95, k * k), .65 + k * 1.8)); }
  const funnel = mesh(new THREE.LatheGeometry(funnelPts, 48), new THREE.MeshStandardMaterial({ color: C.scout, transparent: true, opacity: .14, side: THREE.DoubleSide, emissive: C.scout, emissiveIntensity: .3, depthWrite: false }), 0, 0, .55, s.group);
  const FILTERS = ['already seen', 'dealbreaker', 'below salary floor', 'too old (--days)'];
  const ringY = [2.0, 1.65, 1.3, .95];
  const radAt = (y) => THREE.MathUtils.lerp(.22, .95, Math.pow((y - .65) / 1.8, 2));
  const filters = FILTERS.map((f, k) => {
    const m = mat(C.scout, 1.0);
    const r = mesh(new THREE.TorusGeometry(radAt(ringY[k]), .03, 8, 64), m, 0, ringY[k], .55, s.group); r.rotation.x = Math.PI / 2;
    const el = detail(s, f, 1.75, ringY[k], .55);
    return { m, flash: 0, el };
  });
  const readout = label('', 'readout', s.group, -1.9, 1.5, .8); readout.style.opacity = 0;
  const N = 18, SURV = [2, 5, 9, 12, 16];
  const cards = [];
  for (let i = 0; i < N; i++) {
    const m = new THREE.MeshStandardMaterial({ color: C.paper, emissive: C.scout, emissiveIntensity: .25, transparent: true });
    const c = mesh(cardGeo, m, 0, 0, 0, s.group); c.visible = false;
    const surv = SURV.indexOf(i);
    cards.push({ c, m, tower: i % 3, reject: surv >= 0 ? -1 : (i * 7) % 4, slot: surv });
  }
  const shortlistTag = detail(s, 'shortlist · freshest first · referral path per row', 0, .95, 1.75, 'ok');
  const P = new THREE.Vector3();
  s.update = (t, time) => {
    let found = 0, dropped = 0;
    filters.forEach((f) => { f.flash *= .9; });
    for (let i = 0; i < N; i++) {
      const k = cards[i]; const u = seg(t, i * .025, i * .025 + .4);
      k.c.visible = u > 0; if (u <= 0) continue; found++;
      k.m.opacity = 1; k.m.color.setHex(C.paper); k.m.emissive.setHex(C.scout);
      if (u < .35) {
        const a = u / .35; P.lerpVectors(towerTops[k.tower], new THREE.Vector3(0, 2.6, .55), a); P.y += Math.sin(Math.PI * a) * .6;
        k.c.position.copy(P); k.c.rotation.set(a * 3, i, 0);
      } else {
        const b = (u - .35) / .65;
        const y = 2.4 - b * 1.6, r = radAt(Math.max(y, .66)) * .7, ang = i * 1.3 + b * 6;
        P.set(r * Math.cos(ang), y, .55 + r * Math.sin(ang));
        const bk = k.reject >= 0 ? (2.4 - ringY[k.reject]) / 1.6 : 2;
        if (b > bk) {
          const e = clamp01((b - bk) * 3.2);
          const out = new THREE.Vector3(Math.cos(ang), 0, Math.sin(ang));
          P.set(radAt(ringY[k.reject]) * Math.cos(ang), ringY[k.reject], .55 + radAt(ringY[k.reject]) * Math.sin(ang))

  Object.entries(N).forEach(([k, [x, y]]) => {
    const m = mat(k === 'you' ? 0xffffff : C.networker, .4);
    const geo = k === 'co' ? new THREE.BoxGeometry(.4, .4, .4) : new THREE.SphereGeometry(k === 'you' ? .2 : .15, 20, 14);

  });
  const E = [['you', 'a'], ['you', 'b'], ['a', 'd'], ['b', 'c'], ['b', 'e'], ['c', 'co'], ['d', 'c'], ['e', 'co']];
  const PATH = ['you-b', 'b-c', 'c-co'];
  const edges = {};
  E.forEach(([a, b]) => { const m = mat(0x475569, .2); edges[a + '-' + b] = { m, o: rod(nodes[a].p, nodes[b].p, .025, m, s.group) }; });

    files: TILES, scripts: [] },

// camera for a station step: outside the station, looking at it
function stationCam(sKey) {
  const s = stations[sKey]; const p = s.group.position.clone();
  const out = s.faceFront ? new THREE.Vector3(.25, 0, 1).normalize() : new THREE.Vector3(p.x, 0, p.z).normalize();
  const side = new THREE.Vector3(-out.z, 0, out.x);
  const dist = sKey === 'strategist' ? 7.5 : sKey === 'apply' ? 7 : 9.6;
  return [p.clone().addScaledVector(out, dist).addScaledVector(side, -1.2).add(new THREE.Vector3(0, 4.6, 0)), p.clone().add(new THREE.Vector3(0, 1.6, 0))];
}

// ---------- UI ----------
const panel = document.getElementById('panel');
const dotsEl = document.getElementById('dots');
const playBtn = document.getElementById('play');
const dots = STEPS.map((st, i) => {
  const b = document.createElement('button'); b.textContent = st.role.replace(/^\d+ · /, '');
  b.title = st.role; b.innerHTML += '<span class="bar"></span>';
  b.addEventListener('click', () => go(i)); dotsEl.appendChild(b); return b;
});
const esc = (x) => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function renderPanel(st) {
  const col = hex(st.color);
  document.documentElement.style.setProperty('--role', col);
  panel.innerHTML = `
    <div class="kicker">Step ${cur + 1} / ${STEPS.length} · <b>${st.role}</b></div>
    <h1>${esc(st.title)}</h1>
    <div class="cmd">${esc(st.cmd)}</div>
    <p>${esc(st.text)}</p>
    <ol>${st.flow.map((f) => `<li>${esc(f).replace(/`([^`]+)`/g, '<code>$1</code>')}</li>`).join('')}</ol>
    ${st.files.length ? `<h2>Files it reads or writes</h2><div class="chips">${st.files.map((f) => `<span class="chip file">${esc(f)}</span>`).join('')}</div>` : ''}
    ${st.scripts.length ? `<h2>Scripts (run through jh)</h2><div class="chips">${st.scripts.map((f) => `<span class="chip script">${esc(f)}</span>`).join('')}</div>` : ''}
    ${st.note ? `<div class="note">${esc(st.note)}</div>` : ''}`;
  dots.forEach((d, i) => d.classList.toggle('on', i === cur));
}

// ---------- state & transitions ----------
let cur = -1, stepTime = 0, playing = !REDUCE, userMoved = false;
let camFrom = null, camTo = null, camT = 1;
let tokenFrom = new THREE.Vector3(), tokenT = 1, tokenWasVisible = false;
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();

controls.addEventListener('start', () => { userMoved = true; });

function go(i) {
  i = (i + STEPS.length) % STEPS.length;
  const prev = STEPS[cur];
  cur = i; stepTime = 0; userMoved = false;
  const st = STEPS[cur];
  const [pos, tgt] = st.cam ? st.cam.map((a) => new THREE.Vector3(...a)) : stationCam(st.key);
  camFrom = [camera.position.clone(), controls.target.clone()]; camTo = [pos, tgt]; camT = REDUCE ? 1 : 0;
  if (REDUCE) { camera.position.copy(pos); controls.target.copy(tgt); }
  tokenFrom.copy(token.position); tokenWasVisible = token.visible; tokenT = 0;
  ringProgressTarget = st.ring;
  if (st.key === 'ops') ringProgressTarget = 5 / 6;      // the loop closes during this step
  stageLit = st.stage;
  Object.values(stations).forEach((s) => {
    const on = s.key === st.key;
    s.lbl.classList.toggle('dim', !on && st.key !== 'overview' && st.key !== 'end');
    s.details.forEach((d) => d.classList.remove('show'));
    s.keep.forEach((d) => d.classList.toggle('show', on));
  });
  hubLbl.classList.toggle('dim', !(st.key === 'hub' || st.key === 'overview' || st.key === 'end'));
  renderPanel(st);
}

function tokenTarget(st, t) {
  const s = stations[st.key];
  if (!s || !s.tokenAt) return null;
  return s.tokenAt(t);
}

document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶︎'; };
playBtn.textContent = playing ? '❚❚' : '▶︎';
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') go(cur + 1);
  else if (e.key === 'ArrowLeft') go(cur - 1);
  else if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
});

// ---------- resize ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h); composer.setSize(w, h);
  bloom.setSize(w, h);
  camera.aspect = w / h;
  const panelW = w > 820 ? 400 + 16 : 0;
  if (panelW) camera.setViewOffset(w, h, -panelW / 2, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- loop ----------
const clock = new THREE.Clock();
let time = 0;
go(0);
function frame() {
  tick(Math.min(clock.getDelta(), .05));
  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// For inspection: jhDebug.at(stepIndex, seconds) jumps to a moment and renders it.
window.jhDebug = {
  at(i, seconds) {
    go(i); const was = playing; playing = true;
    for (let k = 0; k < seconds * 30; k++) { tick(1 / 30); if (stepTime >= STEPS[cur].dur) stepTime = STEPS[cur].dur - .01; }
    playing = was; composer.render(); labelRenderer.render(scene, camera); clock.getDelta();
  },
  pause() { playing = false; playBtn.textContent = '▶︎'; },
};
function tick(dt) {
  time += REDUCE ? 0 : dt;
  const st = STEPS[cur];
  if (playing) stepTime += dt;
  const t = REDUCE ? 1 : clamp01(stepTime / st.dur);
  dots[cur].querySelector('.bar').style.width = (t * 100) + '%';
  dots.forEach((d, i) => { if (i !== cur) d.querySelector('.bar').style.width = '0'; });
  if (playing && stepTime >= st.dur + .6) go(cur + 1);

  // camera flight (skipped while the user is orbiting)
  if (camT < 1 && !userMoved) {
    camT = Math.min(1, camT + dt / 1.8); const e = ease(camT);
    camera.position.lerpVectors(camFrom[0], camTo[0], e);
    controls.target.lerpVectors(camFrom[1], camTo[1], e);
  }
  controls.update();

  // station animations: the active one plays, the others rest at their end state
  Object.values(stations).forEach((s) => {
    const active = s.key === st.key;
    s.update(active ? t : 0, time, active);
    s.edge.material.emissiveIntensity = active ? 2.2 + Math.sin(time * 4) * .5 : 1.0;
  });

  // ring progress; Operations sweeps the rest of the loop
  if (st.key === 'ops') ringProgressTarget = 5 / 6 + ease(seg(t, .7, .98)) / 6;
  ringProgress += (ringProgressTarget - ringProgress) * Math.min(1, dt * 3);
  if (REDUCE) ringProgress = ringProgressTarget;
  setRingDraw(ringProgress);

  // hub: jh probes and tiles appear during setup
  const hubStep = st.key === 'hub';
  probes.forEach((p, i) => {
    const at = .08 + i * .12, on = hubStep && t > at;
    const okp = i === 3;
    p.m.emissive.setHex(on ? (okp ? C.ok : C.bad) : C.steel); p.m.emissiveIntensity = on ? 2 : .2;
    p.el.classList.toggle('show', hubStep);
    p.el.classList.toggle('ok', on && okp); p.el.classList.toggle('bad', on && !okp);
  });
  jhLbl.style.opacity = hubStep ? '' : '0';
  jhCore.material.emissiveIntensity = 1 + Math.sin(time * 3) * .3;
  TILES.forEach((name, i) => {
    const tl = tiles[name];
    const grow = hubStep ? ease(seg(t, .55 + i * .03, .65 + i * .03)) : 1;
    tl.g.scale.setScalar(Math.max(.001, grow));
    const hot = st.files.includes(name) && st.key !== 'overview' && st.key !== 'end';
    tl.heat = Math.max(tl.heat * .95, hot ? .5 : 0);
    tl.m.emissiveIntensity = .05 + tl.heat * 1.4;
    tl.el.classList.toggle('hot', hot);
    tl.el.style.opacity = (hot || hubStep) ? '' : '0';
  });

  // pipeline ladder
  pills.forEach((p, i) => {
    const on = i < stageLit;
    p.m.emissive.setHex(on ? C.ok : C.steel);
    p.m.emissiveIntensity = on ? (i === stageLit - 1 ? 1.8 + Math.sin(time * 4) * .4 : 1.0) : .1;
    p.el.classList.toggle('hot', on);
  });

  // token
  const s = stations[st.key];
  const target = tokenTarget(st, t);
  const showToken = !!target && st.key !== 'strategist';
  if (showToken) {
    tokenT = Math.min(1, tokenT + dt / 1.4);
    if (!tokenWasVisible || REDUCE) { token.position.copy(target); token.scale.setScalar(ease(Math.min(1, tokenT * 2)) || .001); }
    else {
      const e = ease(tokenT);
      tmpA.lerpVectors(tokenFrom, target, e); tmpA.y += Math.sin(Math.PI * e) * 2.2 * (tokenT < 1 ? 1 : 0);
      token.position.copy(tmpA); token.scale.setScalar(1);
    }
    token.visible = true;
    token.lookAt(camera.position);
    token.position.y += Math.sin(time * 2.2) * .04;
    const isDoc = cur >= STEPS.findIndex((x) => x.key === 'writer') && (st.key !== 'writer' || (s.morph && s.morph(t) > .5));
    tokenCard.visible = !isDoc; tokenDoc.visible = isDoc;
    tokenMat.emissive.setHex(C.qualifier);
  } else { token.visible = false; }

  // packets: each active step writes into its files
  if (!REDUCE && s && (s.writes || st.writes) && t > .1 && t < .95) {
    packetClock += dt;
    if (packetClock > .45) {
      packetClock = 0;
      const list = st.writes || s.writes;
      spawnPacket(s.group.getWorldPosition(tmpB).add(new THREE.Vector3(0, 1.4, 0)), list[Math.floor(Math.random() * list.length)]);
    }
  }
  packets.forEach((p) => {
    if (!p.m.visible) return;
    p.t += dt / 1.3;
    if (p.t >= 1) { p.m.visible = false; p.to.heat = 1; return; }
    p.curve.getPoint(ease(p.t), p.m.position);
  });
}
requestAnimationFrame(frame);
</script>
